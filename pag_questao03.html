<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Site</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/scripts_questao03.js" defer></script>
</head>

<body>
    <h1> Calculadora de combustivel </h1>
    
    <div id="div-form">
        <h3>Calcúlo</h3>
        
        <form id="formulario">
             
             <label for="Distancia">Distância a ser pecorrida (em Km)</label>
             <input type="text" name="Distância" id="num1">     
        
             <label for="Consumo">Consumo médio do veículo (em km/l)</label>
             <input type="text" name="Consumo">

             <label for="Preço">Preço do litro do combustível</label>
             <input type="text" name="Preço">


             <button type="submit"> Enviar </button>
             <button type="reser"> Limpar </button>
        </form>


        <div id="div-dados"></div>
    </div>
</body>
</html>
